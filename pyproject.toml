[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenmeter-dashboard"
version = "0.2.7"
description = "Local token usage, cost and limits dashboard for Claude Code, Codex and GitHub Copilot CLI"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "Serkan Korkut"}]
keywords = ["claude-code", "claude", "codex", "copilot", "github-copilot", "token-usage", "usage-tracker", "cost", "llm-cost", "dashboard", "llm", "anthropic", "openai"]
classifiers = [
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
  "Topic :: System :: Monitoring"
]

[project.urls]
Homepage = "https://tokenmeter.fyi"
Documentation = "https://tokenmeter.fyi/docs/"
Source = "https://github.com/serkankorkut/tokenmeter"
Issues = "https://github.com/serkankorkut/homebrew-tap/issues"

[project.scripts]
tokenmeter = "tokenmeter.server:main"

[tool.setuptools]
packages = ["tokenmeter"]

[tool.setuptools.package-data]
tokenmeter = ["index.html", "pricing.json"]